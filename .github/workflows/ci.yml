name: DYNAMO CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend-validation:
    name: Backend Tests & Lint (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install System Dependencies (PostgreSQL headers)
        run: |
          sudo apt-get update
          sudo apt-get install -y libpq-dev

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest httpx

      - name: Code Quality & Linting
        run: |
          # Stop build if there are Python syntax errors or undefined names
          flake8 backend tests --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warning exit for complexity
          flake8 backend tests --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Run Test Suite
        env:
          GROQ_API_KEY: "test_dummy_key"
          GROQ_MODEL: "openai/gpt-oss-20b"
          DATABASE_URL: "sqlite:///:memory:"
        run: |
          python -m unittest discover tests

  frontend-validation:
    name: Frontend Build & Type Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package.json'

      - name: Install Node Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build

      - name: Verify Distribution Assets
        working-directory: frontend
        run: |
          test -f dist/index.html || exit 1
          echo "✓ Frontend bundle built successfully!"

  container-smoke-test:
    name: Container Compose Integration Test
    runs-on: ubuntu-latest
    needs: [backend-validation, frontend-validation]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Start Containers
        env:
          GROQ_API_KEY: "test_key"
          GROQ_MODEL: "openai/gpt-oss-20b"
        run: |
          docker compose up --build -d
          echo "Waiting for services to become healthy..."
          sleep 15

      - name: Test Backend Health Endpoint
        run: |
          curl --fail --retry 5 --retry-delay 3 http://localhost:8000/health || exit 1
          echo "✓ Backend healthcheck passed!"

      - name: Teardown
        if: always()
        run: docker compose down -v
