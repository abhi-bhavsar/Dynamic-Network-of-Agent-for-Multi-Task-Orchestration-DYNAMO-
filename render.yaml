services:
  # ── Backend: FastAPI + LangGraph Multi-Agent Engine ────────
  - type: web
    name: dynamo-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: DATABASE_URL
        sync: false
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO

  # ── Frontend: Modern React Executive Dashboard (Static Site) ─
  - type: static
    name: dynamo-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    autoDeploy: true

    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: dynamo-backend
          property: host
